<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Mini App - Bridge Test (Static Host)</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    #log { white-space: pre-wrap; background: #f2f2f2; padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 16px; }
    button { padding: 10px 16px; font-size: 15px; }
  </style>
</head>
<body>
  <h3>Bridge Test (Static Host)</h3>
  <button id="btnTest">Jalankan Test</button>
  <div id="log">Menunggu...</div>

  <script>
    // GANTI dengan URL .../exec dari deployment Apps Script kamu (Code.gs versi baru)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyExw5Ixp0-kSVTIrVWF0efebX6zY72aWQPoo76N27hkP8Rx1_tqijPtX4SGchIPgd6fA/exec';

    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += '\n' + msg;
    }

    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
      log('Telegram.WebApp terdeteksi. Platform: ' + tg.platform + ', version: ' + tg.version);
      log('initDataUnsafe.user: ' + JSON.stringify(tg.initDataUnsafe && tg.initDataUnsafe.user));

      tg.MainButton.setText('Kirim Test');
      tg.MainButton.show();
      tg.MainButton.onClick(function () {
        log('MainButton diklik.');
      });
    } else {
      log('window.Telegram.WebApp TIDAK terdeteksi.');
    }

    document.getElementById('btnTest').addEventListener('click', async function () {
      log('Mengirim fetch ke Apps Script...');
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            hello: 'from static host',
            initData: tg ? tg.initData : null
          })
        });
        const data = await res.json();
        log('SUKSES dari server: ' + JSON.stringify(data));
      } catch (err) {
        log('GAGAL: ' + err.message);
      }
    });
  </script>
</body>
</html>
