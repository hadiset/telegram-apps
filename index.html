<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Order</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">
  <div class="max-w-md mx-auto p-5">
    <h1 class="text-xl font-semibold text-gray-800 mb-1">Form Order</h1>
    <p class="text-sm text-gray-500 mb-5">ID order dicatat otomatis, kamu cukup isi nama dan tanggal.</p>

    <form id="orderForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ID Order</label>
        <input id="orderId" type="text" readonly value="Dibuat otomatis setelah submit"
          class="w-full rounded-lg border border-gray-200 bg-gray-100 px-3 py-2 text-gray-500 text-sm">
      </div>

      <div>
        <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
        <input id="nama" name="nama" type="text" required placeholder="Contoh: Bu Tri Indah"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="tanggal" class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
        <input id="tanggal" name="tanggal" type="date" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="resi" class="block text-sm font-medium text-gray-700 mb-1">Resi Order (PDF)</label>
        <input id="resi" name="resi" type="file" accept="application/pdf"
          class="w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 file:text-sm">
      </div>

      <div>
        <label for="bukti" class="block text-sm font-medium text-gray-700 mb-1">Bukti Transfer (JPG/PNG)</label>
        <input id="bukti" name="bukti" type="file" accept="image/jpeg,image/png"
          class="w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 file:text-sm">
      </div>

      <button id="submitBtn" type="submit"
        class="w-full rounded-lg bg-blue-600 text-white font-medium py-2.5 text-sm hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
        Simpan Order
      </button>
    </form>

    <div id="status" class="mt-4 text-sm"></div>
  </div>

  <script>
    // GANTI dengan URL .../exec dari deployment Apps Script kamu
    const APPS_SCRIPT_URL = 'PASTE_URL_EXEC_APPS_SCRIPT_DI_SINI';

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const orderIdEl = document.getElementById('orderId');
    const tanggalEl = document.getElementById('tanggal');
    tanggalEl.valueAsDate = new Date();

    function readFileAsBase64(fileInput) {
      const file = fileInput.files[0];
      if (!file) return Promise.resolve(null);
      if (file.size > 5 * 1024 * 1024) {
        return Promise.reject(new Error(`File "${file.name}" lebih dari 5MB, mohon kompres dulu.`));
      }
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1];
          resolve({data: base64, filename: file.name, mimeType: file.type});
        };
        reader.onerror = () => reject(new Error(`Gagal membaca file "${file.name}".`));
        reader.readAsDataURL(file);
      });
    }

    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      statusEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Menyimpan...';

      try {
        const [resi, bukti] = await Promise.all([
          readFileAsBase64(document.getElementById('resi')),
          readFileAsBase64(document.getElementById('bukti'))
        ]);

        const payload = {
          nama: document.getElementById('nama').value,
          tanggal: tanggalEl.value,
          telegramUser: tg ? tg.initDataUnsafe.user : null,
          initData: tg ? tg.initData : null,
          startParam: tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : null,
          resi: resi,
          bukti: bukti
        };

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.ok) {
          orderIdEl.value = data.id;
          statusEl.innerHTML = `<span class="text-green-600 font-medium">Berhasil disimpan.</span> ID: ${data.id}`;
          document.getElementById('nama').value = '';
          document.getElementById('resi').value = '';
          document.getElementById('bukti').value = '';
          if (tg) tg.HapticFeedback.notificationOccurred('success');
        } else {
          statusEl.innerHTML = `<span class="text-red-600 font-medium">Gagal: ${data.error || 'unknown error'}</span>`;
        }
      } catch (err) {
        statusEl.innerHTML = `<span class="text-red-600 font-medium">Gagal mengirim: ${err.message}</span>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Simpan Order';
      }
    });
  </script>
</body>

</html>
